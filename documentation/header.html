<script>
DoxygenAwesomeDarkModeToggle.init();
DoxygenAwesomeParagraphLink.init();
DoxygenAwesomeInteractiveToc.init();
window.addEventListener('load', () => {
  const toggle = document.querySelector('doxygen-awesome-dark-mode-toggle');
  if (!toggle) return;
  toggle.tabIndex = 0;
  toggle.setAttribute('role', 'button');
  toggle.setAttribute('aria-label', 'Toggle light or dark theme');
  toggle.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggle.click();
    }
  });
});
</script>
<script type="module">
const diagrams = [...document.querySelectorAll('pre.mermaid')];
if (diagrams.length > 0) {
  const sources = diagrams.map(diagram => diagram.textContent);
  const root = document.documentElement;
  const theme = () => root.classList.contains('dark-mode') ? 'dark' : 'default';
  try {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    let currentTheme;
    let pending = Promise.resolve();
    const render = () => {
      pending = pending.then(async () => {
        const nextTheme = theme();
        if (nextTheme === currentTheme) return;
        currentTheme = nextTheme;
        mermaid.initialize({ startOnLoad: false, theme: nextTheme });
        diagrams.forEach((diagram, index) => {
          diagram.textContent = sources[index];
          diagram.removeAttribute('data-processed');
        });
        await mermaid.run({ nodes: diagrams });
      }).catch(error => console.warn('Could not render the diagram', error));
    };
    new MutationObserver(render).observe(root, { attributeFilter: ['class'] });
    render();
  } catch (error) {
    console.warn('Could not load Mermaid', error);
  }
}
</script>
