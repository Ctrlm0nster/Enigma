[tools]
cmake = "4.5.1"
ninja = "1.13.2"

[tasks.configure]
description = "Configure a Release build with CMake and Ninja"
run = "cmake -S . -B build/mise -G Ninja -DCMAKE_BUILD_TYPE=Release"

[tasks.build]
description = "Build Enigma and its tests"
depends = ["configure"]
run = "cmake --build build/mise"

[tasks.test]
description = "Build and run the Enigma tests"
depends = ["build"]
run = "ctest --test-dir build/mise --output-on-failure"

[tasks.run]
description = "Build and launch Enigma Workbench"
depends = ["build"]
run = "./build/mise/Enigma"
run_windows = ".\\build\\mise\\Enigma.exe"

[tasks.docs]
description = "Generate documentation with Doxygen and Mermaid diagrams"
run = "doxygen Doxyfile"

[tasks."bombe:build"]
description = "Build the renderer-independent Bombe command-line tool"
depends = ["configure"]
run = "cmake --build build/mise --target EnigmaBombe"

[tasks.bombe]
description = "Decipher or search with the Enigma Bombe"
depends = ["bombe:build"]
run = "./build/mise/EnigmaBombe"
run_windows = ".\\build\\mise\\EnigmaBombe.exe"

[tasks.sanitize]
description = "Build and test Enigma with AddressSanitizer and UBSan"
run = "cmake -S . -B build/sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENIGMA_ENABLE_SANITIZERS=ON && cmake --build build/sanitized && ctest --test-dir build/sanitized --output-on-failure"
