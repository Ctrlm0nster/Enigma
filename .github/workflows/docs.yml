name: Deploy Documentation

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --silent --show-error \
            --output doxygen-1.18.0.linux.bin.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen-1.18.0.linux.bin.tar.gz' | sha256sum --check
          tar -xzf doxygen-1.18.0.linux.bin.tar.gz
          sudo install -m 0755 doxygen-1.18.0/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

      - name: Upload Documentation Artifact (Always Available)
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-html
          path: docs/html/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
