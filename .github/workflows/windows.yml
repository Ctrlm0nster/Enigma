name: Windows build and tests

on:
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'test/**'
      - 'assets/**'
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'test/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: MSVC build, shaders, and tests
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg/vcpkg.exe" install --triplet x64-windows glfw3 freetype libjpeg-turbo vulkan-loader shaderc 'spirv-tools[tools]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH

      - name: Build Workbench and validate shaders
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC installation not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $installed = "$vcpkg/installed/x64-windows"
          $configure = @(
            '-S', '.', '-B', 'build/windows', '-G', 'Ninja'
            '-DCMAKE_BUILD_TYPE=Release'
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake"
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DCMAKE_CXX_FLAGS=/utf-8 /DNOMINMAX'
            "-DVulkan_GLSLC_EXECUTABLE=$installed/tools/shaderc/glslc.exe"
            "-DSPIRV_VAL_EXECUTABLE=$installed/tools/spirv-tools/spirv-val.exe"
            '-DENIGMA_REQUIRE_SHADER_VALIDATION=ON'
          )
          cmake @configure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows --target Enigma EnigmaBombe EnigmaTests

      - name: Run automated tests
        run: ctest --test-dir build/windows --output-on-failure

      - name: Check the Bombe CLI
        shell: pwsh
        run: |
          $plaintext = & ./build/windows/EnigmaBombe.exe decipher --ciphertext BDZGO --start AAA --rings '01,01,01'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($plaintext -cne 'AAAAA') { throw "Unexpected Bombe output '$plaintext'" }
