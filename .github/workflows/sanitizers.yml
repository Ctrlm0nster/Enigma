name: Sanitizers & Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  sanitizers:
    name: ${{ matrix.compiler }} - ASan & UBSan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libvulkan-dev \
            libglfw3-dev \
            libfreetype-dev \
            libjpeg-dev \
            glslc \
            spirv-tools \
            xvfb \
            mesa-vulkan-drivers

      - name: Configure CMake with Sanitizers
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENIGMA_ENABLE_SANITIZERS=ON \
            -DENIGMA_REQUIRE_SHADER_VALIDATION=ON

      - name: Build Workbench, Bombe, and tests
        run: cmake --build build/sanitized --target Enigma EnigmaBombe EnigmaTests

      - name: Run Tests with Sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:symbolize=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --test-dir build/sanitized --output-on-failure

      - name: Run Graphical Smoke Test (Xvfb + Lavapipe)
        env:
          ASAN_OPTIONS: "detect_leaks=1:symbolize=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1 || true)
          if [ -n "$LVP_ICD" ]; then
            export VK_ICD_FILENAMES="$LVP_ICD"
            export VK_DRIVER_FILES="$LVP_ICD"
          fi
          xvfb-run -a -s "-screen 0 1320x840x24" ./build/sanitized/Enigma --smoke-test
